name: Publicar VIRA Online
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publicar-vira.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "vira-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empacotar a versão web
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
