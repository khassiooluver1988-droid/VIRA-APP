name: Testar iPhone WebKit
on:
  push:
    branches: [main]
    paths: ['docs/**', 'tests/e2e-webkit.cjs', '.github/workflows/testar-iphone.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Instalar motor WebKit
        run: npx playwright install --with-deps webkit
      - name: Executar no WebKit com resolução iPhone
        run: node tests/e2e-webkit.cjs
