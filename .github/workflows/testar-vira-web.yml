name: Testar VIRA Web
on:
  push:
    branches: [main]
    paths: ['docs/**', 'tests/social-smoke.cjs', '.github/workflows/testar-vira-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checar sintaxe JavaScript
        run: node --check docs/social.js
      - name: Instalar ambiente de testes
        run: npm install --no-save --no-package-lock jsdom@26.1.0
      - name: Testar interações sociais e resolução
        run: node tests/social-smoke.cjs
