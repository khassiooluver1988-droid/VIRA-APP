<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="KLIX">
<meta name="description" content="KLIX — conecte-se, compartilhe momentos e encontre amigos.">
<title>KLIX — Sua rede social</title>
<link rel="preload" as="image" href="./assets/branding/klix-splash.webp?v=1">
<link rel="stylesheet" href="./social.css?v=2">
<link rel="stylesheet" href="./live.css?v=1">
<link rel="stylesheet" href="./kora-theme.css?v=1">
<link rel="stylesheet" href="./klix.css?v=1">
</head><body>
<div id="kora-splash" class="kora-splash klix-splash" aria-hidden="true">
 <img class="splash-logo" src="./assets/branding/klix-splash.webp?v=1" alt="" onerror="this.style.display='none'">
 <span class="klix-splash-fallback">KLIX</span>
</div>
<div class="app" id="app">
 <aside class="sidebar">
  <div class="logo-wrap"><span class="klix-wordmark">KLIX</span></div>
  <nav id="side-nav" class="side-nav" aria-label="Navegação"></nav>
  <div class="side-foot"><b>KLIX Social</b><p>Conecte-se com seus amigos.</p></div>
 </aside>
 <div class="frame">
  <header class="topbar klix-topbar">
   <button class="top-quick klix-top-add" data-act="story-create" aria-label="Adicionar story" title="Adicionar story">＋</button>
   <div class="topbrand"><span class="klix-wordmark">KLIX</span></div>
   <div class="top-actions">
    <button class="icon-btn" data-act="notifications" aria-label="Atividade" title="Atividade">♡</button>
    <button class="icon-btn" data-act="inbox" aria-label="Mensagens" title="Mensagens">✉</button>
   </div>
  </header>
  <main id="view" aria-live="polite"><div class="center-loader">Abrindo o KLIX...</div></main>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navegação principal"></nav>
 </div>
 <aside class="right-column">
  <div class="right-inner"><div class="klix-wordmark">KLIX</div>
   <h3>Pessoas e histórias.</h3>
   <p class="muted">As publicações aparecem conforme pessoas reais entram na rede.</p>
   <button class="primary-btn" data-act="invite">Convidar amigos</button>
  </div>
 </aside>
</div>
<div id="overlay-root"></div>
<div id="toast" role="status" aria-live="polite" class="toast"></div>
<script defer src="./supabase-config.js?v=1"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script defer src="./live.js?v=5"></script>
</body></html>
